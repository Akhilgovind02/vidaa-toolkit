<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>my app on the tv</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#eaeaf0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px}
  h1{font-size:5vw;margin:0;background:linear-gradient(90deg,#5eead4,#818cf8,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .sub{font-size:1.8vw;color:#9aa0b4;max-width:70vw;line-height:1.5}
  .clock{font-size:8vw;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .badge{font-size:1.3vw;color:#5eead4;border:1px solid #1f2a44;padding:10px 22px;border-radius:999px;background:#0a0f1e}
  .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399;animation:p 1.4s infinite}
  @keyframes p{50%{opacity:.3}}
</style></head>
<body><div class="wrap">
  <div class="badge"><span class="dot"></span> served from your own machine</div>
  <h1>this is YOUR app<br>running on the TV</h1>
  <div class="clock" id="c">--:--:--</div>
  <div class="sub">Not an installed app, not casting. The TV's browser engine is loading this page off your LAN at <b id="host"></b> — a page you fully control, full-screen on a VIDAA TV. Replace this with anything (dashboard, launcher, game).</div>
</div>
<script>
  document.getElementById('host').textContent = location.host;
  const t=()=>document.getElementById('c').textContent=new Date().toLocaleTimeString();
  setInterval(t,1000);t();
</script></body></html>
